name: Build CV PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: tales_mousinho_fullstack_cv.tex
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Commit updated PDF
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tales_mousinho_fullstack_cv.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "Update CV PDF"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: tales-mousinho-fullstack-cv-pdf
          path: tales_mousinho_fullstack_cv.pdf
          if-no-files-found: error